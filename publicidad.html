<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Publicidad</title>


    <!-- Bootstrap -->

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">


    <!-- Bootstrap Icons -->

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

</head>


<body>


<!-- NAVBAR -->

<nav class="navbar navbar-expand-lg bg-primary navbar-dark">

    <div class="container">

        <a class="navbar-brand"
           href="index.html">

            <i class="bi bi-building"></i>

            Municipalidad

        </a>


        <div>

            <a class="btn btn-light me-2"
               href="index.html">

                <i class="bi bi-house"></i>

                Inicio

            </a>


            <a class="btn btn-light"
               href="contacto.html">

                <i class="bi bi-telephone"></i>

                Contacto

            </a>

        </div>

    </div>

</nav>


<!-- PUBLICIDAD -->

<div class="container mt-5">

    <h1 class="text-center mb-4">

        <i class="bi bi-megaphone"></i>

        Publicidad Municipal

    </h1>


    <div class="row">


        <!-- CARD 1 -->

        <div class="col-md-4 mb-4">

            <div class="card h-100 shadow">

                <div class="card-body text-center">

                    <i class="bi bi-file-earmark-check fs-1"></i>


                    <h4 class="card-title mt-3">

                        Trámites rápidos

                    </h4>


                    <p class="card-text">

                        Realiza tus trámites municipales
                        de manera rápida y sencilla.

                    </p>


                    <button class="btn btn-primary">

                        <i class="bi bi-info-circle"></i>

                        Más información

                    </button>

                </div>

            </div>

        </div>


        <!-- CARD 2 -->

        <div class="col-md-4 mb-4">

            <div class="card h-100 shadow">

                <div class="card-body text-center">

                    <i class="bi bi-laptop fs-1"></i>


                    <h4 class="card-title mt-3">

                        Servicios en línea

                    </h4>


                    <p class="card-text">

                        Consulta tus trámites desde
                        cualquier dispositivo.

                    </p>


                    <button class="btn btn-primary">

                        <i class="bi bi-arrow-right-circle"></i>

                        Conocer más

                    </button>

                </div>

            </div>

        </div>


        <!-- CARD 3 -->

        <div class="col-md-4 mb-4">

            <div class="card h-100 shadow">

                <div class="card-body text-center">

                    <i class="bi bi-megaphone fs-1"></i>


                    <h4 class="card-title mt-3">

                        Campañas municipales

                    </h4>


                    <p class="card-text">

                        Infórmate sobre las actividades
                        y campañas municipales.

                    </p>


                    <button class="btn btn-primary">

                        <i class="bi bi-calendar-event"></i>

                        Ver campañas

                    </button>

                </div>

            </div>

        </div>


    </div>

</div>


</body>

</html>
